# tests/test_yolo_seg_shp.py 기본 설정
# 경로는 code/ 디렉터리에서 실행하는 기준입니다.
dataset: ../data/2026-08-19_10-16-33_raw
model: ../model/x_model/ver1.0_s.pt
output_dir: ../data/2026-08-19_10-16-33_raw/output

# YOLO 추론
start_frame: 200
max_frames: 999999
stride: 1
confidence: 0.5
batch_size: 16
image_size: 1280
device: "0"
classes: null

# Depth 대표점
depth_radius: 5
max_depth_mm: 8000                    # 원본 마스크 중앙값이 이 거리를 넘으면 검출 전체 제외(mm)
fragment_min_samples: 20
fragment_erosion_px: 2
depth_confidence_max: 200
orientation_source: gps-course-level

# false이면 YOLO 완료 후 SHP 선형화까지 실행합니다.
no_linearize: false
linearization_depth_sample_min: 20
max_gap_connect_m: 6.0
max_heading_deg: 35.0
min_line_support: 5
