# Portable capture defaults for the Jetson Controller folder contract.
# Relative paths are resolved from this repository root by the managed service.
output_dir: results
fps: 30.0
depth_fps: 30
rgb_width: 0
rgb_height: 0
max_runtime_s: 0

# Keep controller state within the approved writable results directory. main.py
# overrides this with JETSON_PIPELINE_SENSOR_BRIDGE_DIR when the controller sets it.
controller_bridge_enabled: true
controller_bridge_dir: results/controller-bridge
controller_status_interval_s: 1.0
controller_sensor_stale_after_s: 3.0
controller_preview_fps: 4.0
controller_preview_max_width: 1280
controller_preview_jpeg_quality: 78

depth_alignment_mode: auto
depth_preset: FAST_ACCURACY
lr_check: true
subpixel: true
subpixel_fractional_bits: 5
stereo_median_filter: "off"
save_confidence_map: false
rotate_180: false

enable_gps: true
rtk_ntrip_auto_mountpoint: true
rtk_ntrip_mountpoint_format: RTCM31
rtk_ntrip_mountpoint_candidates: "GANS-RTCM31,GUMC-RTCM31,DBON-RTCM31,PAJU-RTCM31,YONS-RTCM31,SOUL-RTCM31,INCH-RTCM31,ICOR-RTCM31,SONP-RTCM31,OJBU-RTCM31,PJMS-RTCM31,YANJ-RTCM31,DOND-RTCM31,NAMY-RTCM31,GANH-RTCM31,SWGS-RTCM31,SUWN-RTCM31,POCN-RTCM31,YANP-RTCM31,YEOJ-RTCM31"
# NTRIP_USERNAME과 NTRIP_PASSWORD는 공유 YAML이 아니라 보호 환경변수로 주입합니다.
rtk_ntrip_position_wait_s: 10.0
rtk_ntrip_data_timeout_s: 15.0
rtk_ntrip_max_mountpoints: 12
enable_external_imu: true
